version: "3"

vars:
  LINTER_VER: "v2.12.2"
  GOMODCACHE:
    sh: go env GOMODCACHE
  GOCACHE:
    sh: go env GOCACHE
  PWD_DIR:
    sh: pwd

  BENCH_GOMAXPROCS: "1"
  BENCH_PATTERN: "^Benchmark"
  BENCH_TIME: "2s"
  BENCH_COUNT: "5"

env:
  GOWORK: "off"

tasks:
  run:
    desc: "Full cycle"
    cmds:
      - task: vendor-root
      - task: lint-root
      - task: test-root

  before-commit:
    desc: "Tidy example modules and run all checks"
    cmds:
      - task: tidy-examples
      - task: check-examples
      - task: run

  lint:
    desc: "Lint root module"
    cmds:
      - task: vendor-root
      - task: lint-root

  test:
    desc: "Run all tests"
    cmds:
      - task: vendor-root
      - task: test-root
      - task: test-jwe
      - task: test-jwk
      - task: test-jwks

  tidy-examples:
    desc: "Tidy example module dependencies"
    cmds:
      - |
        set -euo pipefail

        find ./examples -name go.mod -print |
        sort |
        while IFS= read -r mod; do
          dir="$(dirname "$mod")"
          echo "==> $dir"

          (
            cd "$dir"
            GOWORK=off go mod tidy -v
          )
        done

  check-examples:
    desc: "Check example modules against the local checkout"
    cmds:
      - |
        set -euo pipefail

        root="$(pwd)"

        find ./examples -name go.mod -print |
        sort |
        while IFS= read -r mod; do
          dir="$(dirname "$mod")"
          echo "==> $dir"

          (
            workspace="$(mktemp -d)"
            trap 'rm -rf "$workspace"' EXIT

            (
              cd "$workspace"
              GOWORK=off go work init "$root" "$root/${dir#./}"
            )

            cd "$dir"
            GOWORK="$workspace/go.work" go mod verify
            GOWORK="$workspace/go.work" go vet ./...
            GOWORK="$workspace/go.work" go test -race -count=1 ./...
          )
        done

  vendor-root:
    desc: "Vendor root module"
    cmds:
      - rm -rf vendor
      - go mod tidy -v
      - go mod vendor

  lint-root:
    desc: "Lint root module"
    cmds:
      - task: _run-linter
        vars:
          WORK_DIR: /app

  test-root:
    desc: "Test root module"
    env:
      GOWORK: "off"
    cmds:
      - go test -mod=vendor -race -v -count=1 ./...

  test-jwe:
    desc: "Test JWE module"
    cmds:
      - task: _run-module-tests
        vars:
          WORK_DIR: ./jwe

  test-jwk:
    desc: "Test JWK module"
    cmds:
      - task: _run-module-tests
        vars:
          WORK_DIR: ./jwk

  test-jwks:
    desc: "Test JWKS module"
    cmds:
      - task: _run-module-tests
        vars:
          WORK_DIR: ./jwks

  test-jws:
    desc: "Test JWS module"
    cmds:
      - task: _run-module-tests
        vars:
          WORK_DIR: ./jws

  coverage:
    desc: Run tests and print total coverage
    cmds:
      - go test -tags=integration -count=1 -covermode=atomic -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out | grep total

  coverage:html:
    desc: Generate HTML coverage report
    deps:
      - coverage
    cmds:
      - go tool cover -html=coverage.out -o coverage.html

  benchmark:
    desc: "Run all benchmarks"
    aliases:
      - bench
    cmds:
      - task: benchmark:root
      - task: benchmark:jwe

  benchmark:root:
    desc: "Run root module benchmarks"
    aliases:
      - bench:root
    cmds:
      - task: _run-benchmarks
        vars:
          WORK_DIR: .

  benchmark:jwe:
    desc: "Run JWE benchmarks"
    aliases:
      - bench:jwe
    cmds:
      - task: _run-benchmarks
        vars:
          WORK_DIR: ./jwe

  _run-linter:
    desc: "Run golangci-lint in Docker"
    cmds:
      - >
        docker run --rm
        -u $(id -u):$(id -g)
        -v {{.PWD_DIR}}:/app
        -v {{.GOMODCACHE}}:/go/pkg/mod
        -v {{.GOCACHE}}:/go/build-cache
        -e GOMODCACHE=/go/pkg/mod
        -e GOCACHE=/go/build-cache
        -e GOLANGCI_LINT_CACHE=/go/build-cache/golangci-lint
        -e GOWORK=off
        -w {{.WORK_DIR}}
        golangci/golangci-lint:{{.LINTER_VER}}
        golangci-lint run --timeout 5m --fix --modules-download-mode vendor

  _run-benchmarks:
    internal: true
    requires:
      vars:
        - WORK_DIR
    dir: "{{.WORK_DIR}}"
    env:
      GOWORK: "{{.ROOT_DIR}}/go.work"
      GOMAXPROCS: "{{.BENCH_GOMAXPROCS}}"
    cmds:
      - >
        go test
        -run='^$'
        -bench='{{.BENCH_PATTERN}}'
        -benchmem
        -benchtime={{.BENCH_TIME}}
        -count={{.BENCH_COUNT}}
        ./...

  _run-module-tests:
    internal: true
    requires:
      vars:
        - WORK_DIR
    dir: "{{.WORK_DIR}}"
    env:
      GOWORK: "{{.ROOT_DIR}}/go.work"
    cmds:
      - go test -mod=readonly -race -v -count=1 ./...