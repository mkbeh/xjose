name: Go

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        module:
          - jwt
          - jws
          - jwe
          - jwk
          - jwks
          - doctests

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          check-latest: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Create temporary Go workspace
        shell: bash
        run: |
          set -euo pipefail

          workspace="$(mktemp -d "${RUNNER_TEMP}/xjose-workspace.XXXXXX")"

          (
            cd "${workspace}"
            GOWORK=off go work init
            go work use -r "${GITHUB_WORKSPACE}"
          )

          echo "GOWORK=${workspace}/go.work" >> "${GITHUB_ENV}"

      - name: Download dependencies
        working-directory: ${{ matrix.module }}
        run: go mod download

      - name: Verify dependencies
        working-directory: ${{ matrix.module }}
        run: go mod verify

      - name: Check module files
        working-directory: ${{ matrix.module }}
        shell: bash
        run: |
          set -euo pipefail

          go mod tidy

          if [[ -n "$(git status --porcelain -- go.mod go.sum)" ]]; then
            git status --short -- go.mod go.sum
            git diff -- go.mod go.sum
            exit 1
          fi

      - name: Run go vet
        working-directory: ${{ matrix.module }}
        run: go vet -mod=readonly ./...

      - name: Build packages
        working-directory: ${{ matrix.module }}
        run: go build -mod=readonly ./...

  test:
    name: Test (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        module:
          - jwt
          - jws
          - jwe
          - jwk
          - jwks

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          check-latest: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Create temporary Go workspace
        shell: bash
        run: |
          set -euo pipefail

          workspace="$(mktemp -d "${RUNNER_TEMP}/xjose-workspace.XXXXXX")"

          (
            cd "${workspace}"
            GOWORK=off go work init
            go work use -r "${GITHUB_WORKSPACE}"
          )

          echo "GOWORK=${workspace}/go.work" >> "${GITHUB_ENV}"

      - name: Run tests
        working-directory: ${{ matrix.module }}
        run: |
          go test \
            -mod=readonly \
            -tags=integration \
            -race \
            -shuffle=on \
            -count=1 \
            -covermode=atomic \
            -coverpkg=./... \
            -coverprofile=coverage.out \
            ./...

      - name: Print coverage summary
        working-directory: ${{ matrix.module }}
        run: go tool cover -func=coverage.out

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.module }}
          path: ${{ matrix.module }}/coverage.out
          if-no-files-found: error
          retention-days: 7

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./${{ matrix.module }}/coverage.out
          flags: ${{ matrix.module }}
          name: coverage-${{ matrix.module }}
          disable_search: true
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  examples:
    name: Examples
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: jwt/go.mod
          check-latest: true
          cache-dependency-path: |
            jwt/go.sum
            jws/go.sum
            jwe/go.sum
            jwk/go.sum
            jwks/go.sum
            examples/**/go.sum

      - name: Create temporary Go workspace
        shell: bash
        run: |
          set -euo pipefail

          workspace="$(mktemp -d "${RUNNER_TEMP}/xjose-workspace.XXXXXX")"

          (
            cd "${workspace}"
            GOWORK=off go work init
            go work use -r "${GITHUB_WORKSPACE}"
          )

          echo "GOWORK=${workspace}/go.work" >> "${GITHUB_ENV}"

      - name: Set up Task
        uses: go-task/setup-task@v2

      - name: Check example module files
        shell: bash
        run: |
          set -euo pipefail

          find ./examples -name go.mod -print0 |
          sort -z |
          while IFS= read -r -d '' mod; do
            dir="$(dirname "${mod}")"
            echo "==> ${dir}"

            (
              cd "${dir}"
              go mod tidy -v
            )
          done

          if [[ -n "$(git status --porcelain -- examples)" ]]; then
            git status --short -- examples
            git diff -- examples
            exit 1
          fi

      - name: Build and test examples
        run: task check-examples

  doctests:
    name: Doctests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: doctests/go.mod
          check-latest: true
          cache-dependency-path: doctests/go.sum

      - name: Create temporary Go workspace
        shell: bash
        run: |
          set -euo pipefail

          workspace="$(mktemp -d "${RUNNER_TEMP}/xjose-workspace.XXXXXX")"

          (
            cd "${workspace}"
            GOWORK=off go work init
            go work use -r "${GITHUB_WORKSPACE}"
          )

          echo "GOWORK=${workspace}/go.work" >> "${GITHUB_ENV}"

      - name: Run doctests
        working-directory: doctests
        run: |
          go test \
            -mod=readonly \
            -race \
            -shuffle=on \
            -count=1 \
            ./...

  ci:
    name: CI
    if: always()
    needs:
      - verify
      - test
      - examples
      - doctests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check required jobs
        shell: bash
        run: |
          test "${{ needs.verify.result }}" = "success"
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.examples.result }}" = "success"
          test "${{ needs.doctests.result }}" = "success"
