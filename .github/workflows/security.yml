name: Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        module:
          - jwt
          - jws
          - jwe
          - jwk
          - jwks
          - doctests

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          check-latest: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Create temporary Go workspace
        shell: bash
        run: |
          set -euo pipefail

          workspace="$(mktemp -d "${RUNNER_TEMP}/xjose-workspace.XXXXXX")"

          (
            cd "${workspace}"
            GOWORK=off go work init
            go work use -r "${GITHUB_WORKSPACE}"
          )

          echo "GOWORK=${workspace}/go.work" >> "${GITHUB_ENV}"

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          repo-checkout: false
          work-dir: ${{ matrix.module }}
          go-version-file: ${{ matrix.module }}/go.mod
          check-latest: true
          cache: false
          go-package: ./...

  result:
    name: Security
    if: always()
    needs:
      - govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check security jobs
        run: test "${{ needs.govulncheck.result }}" = "success"
