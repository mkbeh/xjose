name: Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOWORK: ${{ github.workspace }}/go.work

jobs:
  govulncheck:
    name: govulncheck (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        module:
          - jwt
          - jws
          - jwe
          - jwk
          - jwks

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          repo-checkout: false
          work-dir: ${{ matrix.module }}
          go-version-file: go.work
          check-latest: true
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum
          go-package: ./...

  result:
    name: Security
    if: always()
    needs:
      - govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check security jobs
        run: test "${{ needs.govulncheck.result }}" = "success"
