name: golangci-lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        module:
          - jwt
          - jws
          - jwe
          - jwk
          - jwks
          - doctests

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          check-latest: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Create temporary Go workspace
        shell: bash
        run: |
          set -euo pipefail

          workspace="$(mktemp -d "${RUNNER_TEMP}/xjose-workspace.XXXXXX")"

          (
            cd "${workspace}"
            GOWORK=off go work init
            go work use -r "${GITHUB_WORKSPACE}"
          )

          echo "GOWORK=${workspace}/go.work" >> "${GITHUB_ENV}"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: ${{ matrix.module }}
          args: >-
            --config=${{ github.workspace }}/.golangci.yml
            --timeout=5m
            --modules-download-mode=readonly

  result:
    name: Lint
    if: always()
    needs:
      - lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check lint jobs
        run: test "${{ needs.lint.result }}" = "success"
