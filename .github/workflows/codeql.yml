name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

jobs:
  analyze:
    name: Analyze Go
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: jwt/go.mod
          check-latest: true
          cache-dependency-path: |
            jwt/go.sum
            jws/go.sum
            jwe/go.sum
            jwk/go.sum
            jwks/go.sum
            doctests/go.sum

      - name: Create temporary Go workspace
        shell: bash
        run: |
          set -euo pipefail

          workspace="$(mktemp -d "${RUNNER_TEMP}/xjose-workspace.XXXXXX")"

          (
            cd "${workspace}"
            GOWORK=off go work init
            go work use -r "${GITHUB_WORKSPACE}"
          )

          echo "GOWORK=${workspace}/go.work" >> "${GITHUB_ENV}"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: manual
          queries: security-extended

      - name: Build modules
        shell: bash
        run: |
          set -euo pipefail

          for module in jwt jws jwe jwk jwks; do
            echo "::group::${module}"
            go build -C "${module}" -mod=readonly ./...
            echo "::endgroup::"
          done

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:go
